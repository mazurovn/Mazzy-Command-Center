let TOKEN=sessionStorage.getItem('mazzy-control-token')||'',SNAPSHOT,DETAILS={},REFRESHING=false,STREAM_CURSOR=0,STREAM_ABORT,RECONNECT=0,FALLBACK,DRAG_ID=null,ACTIVE_SCOPE=sessionStorage.getItem('mazzy-active-scope')||'';const INFLIGHT={};const UI=MazzyChatState.read(localStorage),DRAFTS={},PENDING={},LOCKS=UI.locks||{},UNREAD=UI.unread||{};const E=document.querySelector('#error'),A=document.querySelector('#accepted'),STATUS=document.querySelector('#status'),LIVE=document.querySelector('#live'),hash=new URLSearchParams(location.hash.slice(1));if(hash.get('token')){TOKEN=hash.get('token');sessionStorage.setItem('mazzy-control-token',TOKEN);history.replaceState(null,'',location.pathname)}
function save(){MazzyChatState.write(localStorage,{selected:UI.selected,drawer:UI.drawer,tab:UI.tab,locks:LOCKS,unread:UNREAD})}function esc(x){const d=document.createElement('div');d.textContent=String(x??'');return d.innerHTML}

function api(path,opt={}){if(!TOKEN)return Promise.reject(new Error('Access URL required'));return fetch(path,{...opt,headers:{'content-type':'application/json','x-mazzy-token':TOKEN,...(ACTIVE_SCOPE?{'x-mazzy-project':ACTIVE_SCOPE}:{}),...opt.headers}}).then(async r=>{const d=await r.json();if(!r.ok){const e=new Error(d.error||r.statusText);e.status=r.status;throw e}E.hidden=true;return d})}
function mutationEnabled(){return Boolean(TOKEN)}function setConnection(state){STATUS.textContent=state;}
const SECTIONS=['Backlog','SDD/ADR','Workflows','Agents & Models','Memory & Knowledge','Git & Releases','Audit & Security','Settings','Projects'];const ENABLED={'Backlog':1,'SDD/ADR':1};let SECTION='Backlog';function renderNav(){const nav=document.querySelector('#topnav');if(!nav)return;nav.innerHTML=SECTIONS.map(s=>'<button type="button" data-section="'+escA(s)+'" aria-current="'+(s===SECTION)+'"'+(ENABLED[s]?'':' disabled title="Coming soon"')+'>'+esc(s)+'</button>').join('');nav.querySelectorAll('button[data-section]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;SECTION=b.dataset.section;renderNav();switchView()}))}function switchView(){const bl=document.querySelector('#backlog-view'),gv=document.querySelector('#graph-view-panel');if(!bl||!gv)return;const g=SECTION==='SDD/ADR';bl.hidden=g;gv.hidden=!g;if(g)initGraph()}function renderRail(c,scopes){const rail=document.querySelector('#rail');if(!rail)return;if(!c){rail.innerHTML='<h3>Project</h3><p class="muted">Connecting…</p>';return}const pid=c.projectId?String(c.projectId).slice(0,8):(c.enrolled?'enrolled':'unenrolled (folder-isolated)');const rows=[];rows.push('<div class="rraw">');rows.push('<span>id '+esc(pid)+'</span>');if(c.sessionShort)rows.push('<span>session '+esc(c.sessionShort)+'</span>');if(c.port)rows.push('<span>port '+esc(c.port)+'</span>');rows.push('<span>db '+esc(c.dbSource||'unknown')+'</span>');if(c.registryStatus)rows.push('<span>registry '+esc(c.registryStatus)+'</span>');rows.push('</div>');const docs='<h3>Spec &amp; Architecture</h3><div class="rraw"><span class="'+(c.specPresent?'doclink':'docmiss')+'">'+(c.specPresent?'✓':'—')+' SDD</span><span class="'+(c.architecturePresent?'doclink':'docmiss')+'">'+(c.architecturePresent?'✓':'—')+' Architecture</span></div>';let list='';if(scopes&&scopes.length>1){list='<h3>Projects</h3>'+scopes.map(sp=>{const active=(sp.primary&&!ACTIVE_SCOPE)||sp.id===ACTIVE_SCOPE;return '<button type="button" class="proj scope-btn" data-scope="'+escA(sp.primary?'':sp.id)+'" aria-current="'+active+'"><b>'+esc(String(sp.id).slice(0,8))+'</b>'+(sp.primary?' <span class="muted">(primary)</span>':'')+(sp.label?' <span class="muted">'+esc(sp.label)+'</span>':'')+'</button>'}).join('')}rail.innerHTML='<h3>Current project</h3><div class="proj"><b>'+esc(pid)+'</b>'+rows.join('')+'</div>'+docs+list;rail.querySelectorAll('.scope-btn').forEach(b=>b.addEventListener('click',()=>switchScope(b.dataset.scope||'')))}
function switchScope(scope){if(scope===ACTIVE_SCOPE)return;ACTIVE_SCOPE=scope;if(scope)sessionStorage.setItem('mazzy-active-scope',scope);else sessionStorage.removeItem('mazzy-active-scope');DETAILS={};SNAPSHOT=null;STREAM_CURSOR=0;if(STREAM_ABORT)STREAM_ABORT.abort();accepted('Switched project');loadContext();refresh().then(()=>consumeStream())}
async function loadContext(){if(!TOKEN)return;renderNav();try{const c=await api('/api/context');const parts=[];parts.push(c.projectId?('project '+esc(String(c.projectId).slice(0,8))):(c.enrolled?'project':'unenrolled'));if(c.sessionShort)parts.push('session '+esc(c.sessionShort));if(c.port)parts.push('port '+esc(c.port));parts.push('db '+esc(c.dbSource||'unknown'));parts.push('endpoint '+esc(c.effectiveEndpoint||'unknown'));parts.push('cutover '+(c.cutover?'active':'off'));if(c.sealed)parts.push('SEALED');if(c.registryStatus)parts.push('registry '+esc(c.registryStatus));const ctx=document.querySelector('#ctx');if(ctx)ctx.textContent='· '+parts.join(' · ');let scopes=null;try{scopes=(await api('/api/scopes')).projects}catch(_){}renderRail(c,scopes)}catch(x){renderRail(null)}}function unread(taskId){return UNREAD[taskId]||{lastSeenEventId:0,unreadCount:0}}function reconcileUnread(snapshot){for(const task of snapshot.tasks)if(!UNREAD[task.id])UNREAD[task.id]={lastSeenEventId:snapshot.latestEventId,unreadCount:0};save()}function markSeen(taskId,cursor=STREAM_CURSOR){const seen=unread(taskId);UNREAD[taskId]={lastSeenEventId:Math.max(seen.lastSeenEventId||0,cursor||0,SNAPSHOT?.latestEventId||0),unreadCount:0};save()}function markUnread(taskId,cursor){const seen=unread(taskId);if(cursor<=seen.lastSeenEventId)return;if(UI.drawer&&UI.selected===taskId){markSeen(taskId,cursor);return}UNREAD[taskId]={lastSeenEventId:seen.lastSeenEventId||0,unreadCount:(seen.unreadCount||0)+1};save()}
function renderBoard(){const b=document.querySelector('#board');b.innerHTML='';if(!SNAPSHOT)return;for(const state of SNAPSHOT.states){const c=document.createElement('section');c.className='column';c.innerHTML='<h2>'+state+'</h2><div class="cards" data-drop-state="'+state+'"></div>';const zone=c.querySelector('.cards');for(const d of Object.values(DETAILS).filter(x=>x.task.state===state)){const x=document.createElement('button');x.className='card';x.type='button';x.draggable=mutationEnabled()&&!String(d.task.id).startsWith('optimistic-');x.setAttribute('aria-label','Task '+d.task.title+' in '+d.task.state+'. Drag to an allowed state.');const count=unread(d.task.id).unreadCount||0;const q=d.qualityGates,gateDot=q&&['REVIEW','DONE','RUNNING'].includes(d.task.state)?'<span class="gate-dot '+(q.readyForDone?'ready':'blocked')+'" title="'+q.requiredPassed+'/'+q.requiredTotal+' required gates passed">'+(q.readyForDone?'✔ gates':('⚠ '+q.blocking))+'</span>':'';x.innerHTML='<b class="title">'+esc(d.task.title)+'</b>'+(count?'<span class="unread" aria-label="'+count+' unread updates">'+count+'</span>':'')+gateDot+'<div class="meta"><span class="type-badge type-'+escA(d.task.type||'task')+'">'+esc(d.task.type||'task')+'</span> · rev '+d.task.revision+' · '+esc(d.task.risk)+'</div><div class="desc">'+esc(d.task.description)+'</div>';x.addEventListener('click',()=>openDrawer(d.task.id,true));x.addEventListener('dragstart',e=>{DRAG_ID=d.task.id;e.dataTransfer.setData('text/plain',d.task.id);e.dataTransfer.effectAllowed='move';announce('Dragging '+d.task.title)});x.addEventListener('dragend',()=>{DRAG_ID=null});zone.append(x)}zone.addEventListener('dragover',e=>{const d=DETAILS[DRAG_ID];if(d&&(SNAPSHOT.uiTransitions[d.task.state]||[]).includes(state)){e.preventDefault();zone.classList.add('drop-target');e.dataTransfer.dropEffect='move'}});zone.addEventListener('dragleave',()=>zone.classList.remove('drop-target'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drop-target');const d=DETAILS[e.dataTransfer?.getData('text/plain')||DRAG_ID];DRAG_ID=null;if(!d)return;const allowed=SNAPSHOT.uiTransitions[d.task.state]||[];if(!allowed.includes(state)){error(new Error('Cannot drop '+d.task.title+' into '+state+': the server-provided UI transitions from '+d.task.state+' do not allow it.'));return}transition(d,state,'drop')});b.append(c)}}
async function refresh(affected){if(!TOKEN||REFRESHING)return;REFRESHING=true;try{const s=await api('/api/snapshot');const ids=affected?.length?affected:s.tasks.map(t=>t.id);const batch=await api('/api/task-details',{method:'POST',body:JSON.stringify({taskIds:ids})});for(const d of batch.details)DETAILS[d.task.id]=d;for(const id of Object.keys(DETAILS))if(!s.tasks.some(t=>t.id===id)||String(id).startsWith('optimistic-'))delete DETAILS[id];SNAPSHOT=s;reconcileUnread(s);renderBoard();if(UI.drawer&&DETAILS[UI.selected])renderDrawer(DETAILS[UI.selected],false)}catch(x){error(x)}finally{REFRESHING=false}}
function messages(d){return MazzyChatState.reconcileMessages(d.comments,Object.values(PENDING).filter(c=>c.taskId===d.task.id))}function bubble(c){return '<article class="bubble '+escA(c.role)+' '+(c.deliveryState==='failed'?'failed':'')+'"><div class="meta">'+esc(c.actor)+' · '+esc(c.deliveryState||'sent')+'</div><div class="bubble-body">'+esc(c.body)+'</div>'+(c.deliveryState==='failed'?'<button type="button" data-retry="'+escA(c.clientMessageId)+'">Retry</button><button type="button" data-dismiss="'+escA(c.clientMessageId)+'">Dismiss</button>':'')+'</article>'}function activeBinding(d){return d.bindings.find(b=>b.role==='worker'&&b.state==='active'&&b.acceptanceRevision===d.task.acceptanceRevision)}function requestPending(d,command){return d.requests.some(r=>r.command===command&&['REQUESTED','DELIVERED','CLAIMED'].includes(r.state))}function anyControlPending(d){return d.requests.some(r=>['REQUESTED','DELIVERED','CLAIMED'].includes(r.state))}function controlsLocked(d,command){const pending=anyControlPending(d),lock=LOCKS[d.task.id+':'+command];return pending||MazzyChatState.reconcileControlLock(lock,pending,Date.now())}
function chatMarkup(d){return '<div id="chat" class="chat">'+(messages(d).map(bubble).join('')||'<p class="muted">No comments</p>')+'</div><form id="composer" class="composer"><textarea name="body" maxlength="2000" placeholder="Write a message" required>'+esc(DRAFTS[d.task.id]?.body||'')+'</textarea><div class="actions"><button id="send-comment" '+(!mutationEnabled()?'disabled':'')+'>Send</button></div></form>'}
function overviewMarkup(d){const transitions=(SNAPSHOT.uiTransitions[d.task.state]||[]).map(s=>'<button type="button" class="transition" aria-label="Move task to '+s+'" data-transition="'+s+'" '+(!mutationEnabled()?'disabled':'')+'>Move to '+s+'</button>').join('')||'<span class="muted">No direct UI transitions.</span>';const draft=DRAFTS['edit:'+d.task.id]||d.task;return '<h3>Overview</h3><form id="edit-task" class="fields"><label>Title <input name="title" value="'+escA(draft.title)+'"></label><label>Description / acceptance <textarea name="description">'+esc(draft.description)+'</textarea></label><label>Type <select name="type">'+['epic','feature','task','bug'].map(tp=>'<option '+((draft.type||'task')===tp?'selected':'')+' value="'+tp+'">'+tp+'</option>').join('')+'</select></label><label>Priority <input name="priority" type="number" min="-100" max="100" value="'+escA(draft.priority)+'"></label><label>Risk <select name="risk">'+['low','medium','high','critical'].map(r=>'<option '+(draft.risk===r?'selected':'')+' value="'+r+'">'+r+'</option>').join('')+'</select></label><button '+(!mutationEnabled()?'disabled':'')+'>Save edits</button></form><p class="meta">State '+esc(d.task.state)+' · revision '+d.task.revision+' · acceptance '+d.task.acceptanceRevision+'</p><div id="fsm-controls" class="actions">'+transitions+'</div><h3>Discussion</h3>'+chatMarkup(d)}
function orchestrationMarkup(d){const active=activeBinding(d),goDisabled=!mutationEnabled()||!['BACKLOG','READY','BLOCKED'].includes(d.task.state)||controlsLocked(d,'GO'),interruptDisabled=!mutationEnabled()||!active||controlsLocked(d,'PAUSE')||controlsLocked(d,'STOP');return '<h3>Orchestration</h3><div class="fields"><label>Agent <select id="approved-agent"><option value="auto">auto</option></select></label><label>Cycles <input id="max-cycles" type="number" min="1" max="10" value="1"></label></div><label>Instructions <textarea id="control-instructions" maxlength="4000" placeholder="Optional bounded instructions"></textarea></label><p id="binding-gate" class="meta">'+(active?'Active binding '+esc(active.runId)+' ('+esc(active.agent)+')':'No active worker binding; PAUSE and STOP are unavailable.')+'</p><div id="control-buttons" class="actions"><button type="button" id="go" '+(goDisabled?'disabled':'')+'>GO</button><button type="button" id="pause" '+(interruptDisabled?'disabled':'')+'>PAUSE</button><button type="button" id="stop" '+(interruptDisabled?'disabled':'')+'>STOP</button></div>'}
function runsMarkup(d){return '<h3>Bindings</h3><div id="binding-detail" class="detail-list">'+(d.bindings.map(b=>'<article class="detail-row"><b>'+esc(b.role)+' '+esc(b.agent)+'</b><div class="meta">'+esc(b.state)+' · '+esc(b.lifecycle)+' · run '+esc(b.runId)+'</div></article>').join('')||'<p class="muted">No bindings</p>')+'</div>'}function traceMarkup(d){return '<h3>Trace</h3><div id="trace-detail" class="detail-list">'+(d.events.map(e=>'<article class="detail-row"><b>'+esc(e.type)+'</b><div class="meta">'+esc(e.createdAt)+' · '+esc(e.actor)+'</div></article>').join('')||'<p class="muted">No events</p>')+'</div>'}function gateStatusClass(s){return 'gate-'+String(s||'').toLowerCase().replace('/','')}
function qualityGatesMarkup(d){const q=d.qualityGates;if(!q)return '';const summary='<div class="gate-summary '+(q.readyForDone?'gate-ready':'gate-blocked')+'" role="status">'+(q.readyForDone?'✔ All required gates satisfied':('⚠ '+q.blocking+' blocking gate'+(q.blocking===1?'':'s')))+' · '+q.requiredPassed+'/'+q.requiredTotal+' required passed</div>';const rows=q.gates.map(g=>'<article class="detail-row gate-row"><span class="gate-badge '+gateStatusClass(g.status)+'">'+esc(g.status)+'</span> <b>'+esc(g.label)+'</b>'+(g.required?'':' <span class="muted">(optional)</span>')+'<div class="muted">'+esc(g.category)+' — '+esc(g.detail)+'</div></article>').join('');return '<h3>Quality gates (audit)</h3>'+summary+'<div class="detail-list">'+rows+'</div>'}
function reviewMarkup(d){return qualityGatesMarkup(d)+'<h3>Review evidence</h3><div id="evidence-detail" class="detail-list">'+(d.evidence.map(e=>'<article class="detail-row"><b>'+esc(e.kind)+' · '+esc(e.verdict)+'</b> <span class="gate-badge '+(e.freshness==='current'?'gate-pass':'gate-stale')+'">'+esc(e.freshness)+'</span></article>').join('')||'<p class="muted">No evidence</p>')+'</div>'}
function panel(d,tab){return tab==='Overview'?overviewMarkup(d):tab==='Orchestration'?orchestrationMarkup(d):tab==='Runs'?runsMarkup(d):tab==='Trace'?traceMarkup(d):reviewMarkup(d)}
function bindDrawer(d){const root=document.querySelector('#drawer-root');root.querySelector('#close').addEventListener('click',()=>{UI.drawer=false;save();root.innerHTML=''});root.querySelector('.backdrop').addEventListener('click',()=>root.querySelector('#close').click());root.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{UI.tab=x.dataset.tab;save();renderDrawer(d,false)}));root.querySelectorAll('.transition').forEach(x=>x.addEventListener('click',()=>transition(d,x.dataset.transition,'button')));const edit=root.querySelector('#edit-task');if(edit){edit.addEventListener('input',()=>{DRAFTS['edit:'+d.task.id]={title:edit.elements.title.value,description:edit.elements.description.value,type:edit.elements.type.value,priority:Number(edit.elements.priority.value),risk:edit.elements.risk.value};save()});edit.addEventListener('submit',e=>{e.preventDefault();saveTaskEdit(d,edit)})}const form=root.querySelector('#composer');if(form){form.addEventListener('submit',e=>{e.preventDefault();sendComment(d.task.id,{body:form.elements.body.value,clientMessageId:crypto.randomUUID()})});form.elements.body.addEventListener('input',()=>{DRAFTS[d.task.id]={body:form.elements.body.value,selectionStart:form.elements.body.selectionStart,selectionEnd:form.elements.body.selectionEnd,focused:document.activeElement===form.elements.body};save()});root.querySelectorAll('[data-retry]').forEach(x=>x.addEventListener('click',()=>sendComment(d.task.id,PENDING[x.dataset.retry])));root.querySelectorAll('[data-dismiss]').forEach(x=>x.addEventListener('click',()=>{delete PENDING[x.dataset.dismiss];save();renderDrawer(d,false)}))}for(const command of ['GO','PAUSE','STOP']){const button=root.querySelector('#'+command.toLowerCase());if(button)button.addEventListener('click',()=>control(d,command))}if(root.querySelector('#approved-agent'))loadOptions(d.task.id)}
function renderDrawer(d,focus){const tab=['Overview','Orchestration','Runs','Trace','Review'].includes(UI.tab)?UI.tab:'Overview';UI.tab=tab;const root=document.querySelector('#drawer-root'),oldComposer=root.querySelector('#composer textarea'),preserved=oldComposer?MazzyChatState.preserveComposerOnRefresh({body:oldComposer.value,selectionStart:oldComposer.selectionStart,selectionEnd:oldComposer.selectionEnd,focused:document.activeElement===oldComposer},true):null;root.innerHTML='<div class="backdrop"></div><aside class="drawer" aria-label="Mazzy task detail"><button id="close" type="button">Close</button><h2 id="drawer-title">'+esc(d.task.title)+'</h2><nav class="tabs" aria-label="Task sections">'+['Overview','Orchestration','Runs','Trace','Review'].map(t=>'<button type="button" data-tab="'+t+'" aria-selected="'+(tab===t)+'">'+t+'</button>').join('')+'</nav><section id="task-panel" class="panel">'+panel(d,tab)+'</section></aside>';bindDrawer(d);const composer=root.querySelector('#composer textarea');if(preserved&&preserved.preserveDom&&composer){composer.value=preserved.draft.body;composer.focus();composer.setSelectionRange(preserved.draft.selectionStart,preserved.draft.selectionEnd)}else if(focus)root.querySelector('#drawer-title').focus?.()}
function openDrawer(id,focus){if(!DETAILS[id])return;UI.selected=id;UI.drawer=true;UI.tab=UI.tab||'Overview';markSeen(id);renderDrawer(DETAILS[id],focus)}
async function transition(d,state,source){if(!mutationEnabled())return;const flight=d.task.id+':transition';if(INFLIGHT[flight])return;const allowed=SNAPSHOT.uiTransitions[d.task.state]||[];if(!allowed.includes(state)){error(new Error('Transition to '+state+' is not allowed by this task’s current UI transitions.'));return}INFLIGHT[flight]=1;try{await api('/api/tasks/'+d.task.id,{method:'PATCH',body:JSON.stringify({state,expectedRevision:d.task.revision})});announce((source==='drop'?'Drop accepted: ':'Transition accepted: ')+state);await refresh([d.task.id])}catch(x){if(x.status===409){await refresh([d.task.id]);error(new Error('Task changed on the server. Review its current state before trying again.'))}else error(x)}finally{delete INFLIGHT[flight]}}
async function saveTaskEdit(d,form){const flight=d.task.id+':save';if(INFLIGHT[flight])return;INFLIGHT[flight]=1;try{await api('/api/tasks/'+d.task.id,{method:'PATCH',body:JSON.stringify({title:form.elements.title.value,description:form.elements.description.value,type:form.elements.type.value,priority:Number(form.elements.priority.value),risk:form.elements.risk.value,expectedRevision:d.task.revision})});delete DRAFTS['edit:'+d.task.id];save();accepted('Edits accepted');await refresh([d.task.id])}catch(x){if(x.status===409){await refresh([d.task.id]);error(new Error('Edits were not saved because a newer server revision exists. Reconcile your draft with the refreshed task.'))}else error(x)}finally{delete INFLIGHT[flight]}}
async function sendComment(taskId,message){if(!mutationEnabled()||!message||!message.body.trim())return;const id=message.clientMessageId||crypto.randomUUID();PENDING[id]={id:'local-'+id,taskId,body:message.body.trim(),actor:'user',role:'user',deliveryState:'sending',clientMessageId:id};DRAFTS[taskId]={body:''};save();renderDrawer(DETAILS[taskId],false);try{await api('/api/tasks/'+taskId+'/comments',{method:'POST',body:JSON.stringify({body:message.body.trim(),clientMessageId:id})});delete PENDING[id];save();await refresh([taskId])}catch(x){PENDING[id]={...PENDING[id],deliveryState:'failed',error:x.message};save();renderDrawer(DETAILS[taskId],false);error(x)}}
async function loadOptions(taskId){try{const options=await api('/api/tasks/'+taskId+'/orchestration/options');const select=document.querySelector('#approved-agent');if(select)select.innerHTML='<option value="auto">auto</option>'+options.agents.map(a=>'<option value="'+escA(a.name)+'">'+esc(a.name)+' · '+esc(a.model)+'</option>').join('')}catch(x){error(x)}}
async function control(d,command){const key=d.task.id+':'+command;if(controlsLocked(d,command)||!mutationEnabled())return;const active=activeBinding(d);if(command!=='GO'&&!active){error(new Error(command+' requires an active worker binding'));return}LOCKS[key]={createdAt:Date.now(),ttlMs:15000};save();try{const agent=document.querySelector('#approved-agent'),cycles=document.querySelector('#max-cycles'),instructions=document.querySelector('#control-instructions');await api('/api/tasks/'+d.task.id+'/orchestration',{method:'POST',headers:{'x-idempotency-key':crypto.randomUUID()},body:JSON.stringify({command,expectedRevision:d.task.revision,approvedAgent:agent?.value||'auto',maxCycles:Number(cycles?.value||1),instructions:instructions?.value||undefined})});accepted(command+' requested');await refresh([d.task.id])}catch(x){error(x)}finally{delete LOCKS[key];save()}}
function createPayload(form){return {title:form.elements.title.value,description:form.elements.description.value,type:form.elements.type?.value||'task',priority:Number(form.elements.priority.value),risk:form.elements.risk.value}}function createRecovery(form){const root=document.querySelector('#create-recovery'),raw=sessionStorage.getItem('mazzy-create-recovery');root.innerHTML='';if(!raw){root.hidden=true;return}root.hidden=false;const retry=document.createElement('button');retry.type='button';retry.textContent='Retry original';retry.addEventListener('click',()=>retryOriginalCreate(form));const dismiss=document.createElement('button');dismiss.type='button';dismiss.textContent='Dismiss/start new';dismiss.addEventListener('click',()=>{sessionStorage.removeItem('mazzy-create-recovery');createRecovery(form);accepted('Original create dismissed. Submit the current form to start a new task.')});root.append(retry,dismiss)}async function createTask(form,operation){if(!mutationEnabled())return;const current=operation||{key:crypto.randomUUID(),payload:createPayload(form)},button=form.querySelector('button');button.disabled=true;accepted('Creating task (optimistic)…');DETAILS['optimistic-'+current.key]={task:{id:'optimistic-'+current.key,...current.payload,state:'BACKLOG',revision:0,acceptanceRevision:0,risk:current.payload.risk,createdAt:'',updatedAt:''},comments:[],bindings:[],requests:[],evidence:[],events:[],inconsistencies:[],reportStatus:'report missing'};renderBoard();try{const task=await api('/api/tasks',{method:'POST',headers:{'Idempotency-Key':current.key},body:JSON.stringify(current.payload)});delete DETAILS['optimistic-'+current.key];sessionStorage.removeItem('mazzy-create-recovery');createRecovery(form);if(!operation)form.reset();accepted('Task accepted');await refresh([task.id])}catch(x){delete DETAILS['optimistic-'+current.key];renderBoard();sessionStorage.setItem('mazzy-create-recovery',JSON.stringify(current));createRecovery(form);error(x);accepted('Task create failed. Choose Retry original to replay it, or Dismiss/start new before editing and submitting again.')}finally{button.disabled=!mutationEnabled()}}function retryOriginalCreate(form){const raw=sessionStorage.getItem('mazzy-create-recovery');if(!raw)return;try{return createTask(form,JSON.parse(raw))}catch(x){sessionStorage.removeItem('mazzy-create-recovery');createRecovery(form);error(new Error('Saved create recovery was invalid; start a new task.'))}}
async function consumeStream(){if(!TOKEN)return;STREAM_ABORT=new AbortController();try{setConnection('Reconnecting');const response=await fetch('/api/stream',{headers:{'x-mazzy-token':TOKEN,...(ACTIVE_SCOPE?{'x-mazzy-project':ACTIVE_SCOPE}:{}),'Last-Event-ID':String(STREAM_CURSOR)},signal:STREAM_ABORT.signal});if(!response.ok||!response.body)throw new Error('stream rejected');RECONNECT=0;setConnection('Live');stopFallback();const reader=response.body.getReader(),decoder=new TextDecoder();let pending='',affected=new Set(),timer;const flush=()=>{if(affected.size){const ids=[...affected];affected.clear();refresh(ids)}};while(true){const part=await reader.read();if(part.done)throw new Error('stream ended');pending+=decoder.decode(part.value,{stream:true});let cut;while((cut=pending.indexOf('\n\n'))>=0){const frame=pending.slice(0,cut);pending=pending.slice(cut+2);if(frame.startsWith(':'))continue;const lines=frame.split('\n'),data=lines.find(x=>x.startsWith('data: '));const id=lines.find(x=>x.startsWith('id: '));if(!data||!id)continue;const event=JSON.parse(data.slice(6)),eventType=lines.find(x=>x.startsWith('event: '));STREAM_CURSOR=Math.max(STREAM_CURSOR,Number(id.slice(4))||0);if(eventType==='event: mazzy-reset'||event?.requiresFullSnapshot){affected.clear();await refresh();continue}if(event&&event.taskId){markUnread(event.taskId,STREAM_CURSOR);affected.add(event.taskId);clearTimeout(timer);timer=setTimeout(flush,120)}}}}catch(x){if(STREAM_ABORT?.signal.aborted)return;setConnection('Reconnecting');startFallback();const delay=Math.min(15_000,500*Math.pow(2,Math.min(RECONNECT++,5)));setTimeout(consumeStream,delay)}}
function startFallback(){if(FALLBACK)return;setConnection('Fallback');FALLBACK=setInterval(()=>{if(!document.hidden)refresh()},15_000)}function stopFallback(){if(FALLBACK){clearInterval(FALLBACK);FALLBACK=undefined}}document.querySelector('#refresh').addEventListener('click',()=>refresh());document.querySelector('#create').addEventListener('submit',e=>{e.preventDefault();createTask(e.currentTarget)});let GRAPH_VIEW=null,GRAPH_DOC=null,GRAPH_LOADED=false;async function initGraph(){if(GRAPH_LOADED)return;GRAPH_LOADED=true;const mount=document.querySelector('#graph-mount');if(!mount||!window.MazzyGraphView)return;GRAPH_VIEW=MazzyGraphView.create(mount,{focusDepth:2,onSelect:showGraphDetail});await loadGraph();document.querySelectorAll('#graph-view-panel .glay').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#graph-view-panel .glay').forEach(x=>x.classList.remove('on'));b.classList.add('on');GRAPH_VIEW.setLayout(b.dataset.layout)}));const search=document.querySelector('#graph-search');search.addEventListener('change',()=>{const q=search.value.trim().toLowerCase();if(!q||!GRAPH_DOC)return;const hit=GRAPH_DOC.nodes.find(n=>n.id.toLowerCase()===q||n.label.toLowerCase().includes(q));if(hit){GRAPH_VIEW.setFocus(hit.id);showGraphDetail(hit)}});document.querySelector('#graph-clear').addEventListener('click',()=>{GRAPH_VIEW.setFocus(null);search.value='';document.querySelector('#graph-detail').hidden=true});document.querySelector('#graph-refresh').addEventListener('click',()=>{GRAPH_LOADED=true;loadGraph()})}async function loadGraph(){try{const doc=await api('/api/graph');GRAPH_DOC=doc;const model=GRAPH_VIEW.setDocument(doc);renderLegend(model);const s=document.querySelector('#graph-stats');s.textContent=doc.stats.nodes+' nodes · '+doc.stats.edges+' edges · '+doc.stats.coverageGaps.length+' gaps'+(doc.truncated?' · truncated':'')+' · sources: '+doc.sources.map(x=>x.id+':'+x.status).join(', ')}catch(x){error(x)}}function renderLegend(model){const root=document.querySelector('#graph-legend');root.textContent='';const mk=(title,items,group,idKey)=>{const h=document.createElement('h3');h.textContent=title;root.appendChild(h);items.forEach(it=>{const lbl=document.createElement('label');lbl.className='glegend';const cb=document.createElement('input');cb.type='checkbox';cb.checked=(group==='edges'&&it.id==='references')?false:true;cb.addEventListener('change',()=>GRAPH_VIEW.setFilter(group,it.id,cb.checked));const sw=document.createElement('span');sw.className='swatch';if(it.color)sw.style.background=it.color;const tx=document.createElement('span');tx.textContent=it.label+' ('+it.count+')';lbl.appendChild(cb);if(group==='kinds')lbl.appendChild(sw);lbl.appendChild(tx);root.appendChild(lbl)})};mk('Domains',model.domains,'domains');mk('Artifacts',model.kinds,'kinds');mk('Edges',model.edges,'edges')}function showGraphDetail(n){const d=document.querySelector('#graph-detail');d.hidden=false;d.textContent='';const h=document.createElement('h3');h.textContent=n.label;d.appendChild(h);const meta=[['id',n.id],['kind',n.kind],['domain',n.domain],['status',n.status||'—'],['weight',String(n.weight)],['sources',(n.sources||[]).join(', ')]];meta.forEach(([k,v])=>{const p=document.createElement('p');p.className='gd-row';const b=document.createElement('b');b.textContent=k+': ';const s=document.createElement('span');s.textContent=v;p.appendChild(b);p.appendChild(s);d.appendChild(p)});if(n.domain==='backlog'){const a=document.createElement('button');a.type='button';a.textContent='Open in Backlog';a.addEventListener('click',()=>{SECTION='Backlog';renderNav();switchView();const id=n.id.split(':')[1];if(id&&typeof openDrawer==='function')openDrawer(id,true)});d.appendChild(a)}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN)refresh()});if(TOKEN){loadContext();refresh().then(()=>{createRecovery(document.querySelector('#create'));consumeStream()})}else{setConnection('Access URL required');document.querySelector('#refresh').disabled=true;document.querySelectorAll('#create input,#create textarea,#create select,#create button').forEach(x=>x.disabled=true)}
</script></body></html>
